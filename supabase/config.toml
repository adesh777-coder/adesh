# A string used to distinguish different Supabase projects on the same host.
# Defaults to the working directory name when running `supabase init`.
[api]
enabled = true
# Port to use for the local API. Minimum: 1025, Maximum: 65535.
port = 54321
# Schemas to expose in the API. Tables, views and stored procedures in this schema will get API endpoints.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request. public is always included.
extra_search_path = ["public", "extensions"]
# Maximum request size in bytes. Defaults to 2MB.
max_rows = 1000

[db]
# Port to use for the local database URL. Minimum: 1025, Maximum: 65535.
port = 54322
# Port used by db diff command to initialise the shadow database. Minimum: 1025, Maximum: 65535.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote database's.
major_version = 15

[studio]
enabled = true
# Port to use for Supabase Studio. Minimum: 1025, Maximum: 65535.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
enabled = true
# The base URL of your website. Used as the base URL for magic link callbacks.
site_url = "http://127.0.0.1:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://127.0.0.1:3000"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604800 (1 week).
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
enable_signup = true

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email addresses.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false

[functions.ai-chat]
verify_jwt = false
